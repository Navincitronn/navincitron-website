<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Station To Station (Instrumentals)</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="icon" href="https://i.ibb.co/5hVscL2/navlogo.png" type="image/png">
</head>
<body>
    <header>
        <div class="header-left">
            <img src="https://i.ibb.co/5hVscL2/navlogo.png" alt="navlogo" class="logo" border="0" />
            <div class="brand">
                <h1>NAVINCITRON</h1>
                <br>
                <p>proper music isolation</p>
            </div>
        </div>
        <nav class="topnav">
            <a href="/index.html">Home</a>
            <a href="/about.html">About</a>
            <a href="/contact.html">Contact</a>
        </nav>
    </header>
    <main>
        <section class="instrumentals">
            <h2 class="center">David Bowie - Station To Station (1976)</h2>
            <div class="thumbnail-wrapper" id="thumbnail-wrapper">
                <img src="https://storage.googleapis.com/navincitron-website-bucket/thumbnails/station_to_station.png" alt="Station To Station" class="albumss-thumbnail" id="thumbnail">
                <img src="/play.png" alt="Play" class="play-pause-icon" id="play-icon">
                <img src="/pause.png" alt="Pause" class="play-pause-icon" id="pause-icon">
            </div>
            <div class="audio-player">
                <audio id="audio-player" controls>
                    <source src="https://storage.googleapis.com/navincitron-website-bucket/instrumentals/Station To Station (Instrumentals).mp3" type="audio/mpeg">
                    Your browser does not support the audio element.
                </audio>
                <div class="track-list">
                    <h3>SIDE A</h3>
                    <p><span onclick="setTime(0)">Station To Station - 00:00</span></p>
                    <p><span onclick="setTime(615)">Golden Years - 10:15</span></p>
                    <p><span onclick="setTime(857)">Word On A Wing - 14:17</span></p>
                    <br>
                    <h3>SIDE B</h3>
                    <p><span onclick="setTime(1230)">TVC15 - 20:30</span></p>
                    <p><span onclick="setTime(1564)">Stay - 26:04</span></p>
                    <p><span onclick="setTime(1939)">Wild Is The Wind - 32:19</span></p>
                </div>
            </div>
        </section>
    </main>
    <script src="/script.js"></script>
</body>
</html>
